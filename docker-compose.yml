# Full stack: ChromaDB, PostgreSQL, Neo4j, the API and the frontend.
# Run from the repo root:  docker compose up -d --build
name: rag-qa

services:
  chroma:
    image: chromadb/chroma:latest
    volumes:
      - chroma_data:/chroma/data
    ports:
      - "8001:8000"

  # Structured store for hybrid search (projets, pylones, notes_de_calcul, ...)
  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-bimlo}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-bimlo}
      - POSTGRES_DB=${POSTGRES_DB:-bimlo}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Schema (tables + indexes) applied on first boot
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bimlo} -d ${POSTGRES_DB:-bimlo}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Graph database (users and chat sessions)
  neo4j:
    image: neo4j:latest
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-localdev123}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 15s
      retries: 20
      start_period: 120s

  # Backend API. API keys come from backend/.env (gitignored).
  # The database settings below override backend/.env, so the API always
  # matches the postgres and neo4j containers above.
  api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    environment:
      - CHROMA_HOST=chroma
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-localdev123}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-bimlo}
      - POSTGRES_USER=${POSTGRES_USER:-bimlo}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-bimlo}
      - WIKI_USER_AGENT=RAGQA/1.0
      - HF_HOME=/root/.cache/huggingface
      - SENTENCE_TRANSFORMERS_HOME=/root/.cache/huggingface/sentence_transformers
      - HF_HUB_DISABLE_PROGRESS_BARS=1
      - LOGO_PATH=/app/assets/favicon.png
      - LOGO_SVG_PATH=/app/assets/favicon.svg
      - NEWS_CACHE_DIR=/data/news_cache
      - DATA_DIR=/data
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://frontend
    volumes:
      - ./backend:/app
      - hf_cache:/root/.cache/huggingface
      - news_cache:/data/news_cache
      - ./frontend/public/favicon.png:/app/assets/favicon.png:ro
      - ./frontend/public/favicon.svg:/app/assets/favicon.svg:ro
      # Project JSON files (local only, gitignored), read by scripts/ingest_json.py
      - ./data/projects:/app/data/donnees_json:ro
    depends_on:
      neo4j:
        condition: service_healthy
      chroma:
        condition: service_started
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  chroma_data:
  neo4j_data:
  pg_data:
  hf_cache:
  news_cache:
